<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Curso recepción RXT</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: entrenador amable, claro, paso a paso
   IDEA: un plan de entrenamiento por bloques que se van desbloqueando
   PICTURE: el mapa de bloques con su avance, como tabla de progreso de un atleta
   COLOUR and TYPE: negro RXT, blanco, rojo #E3242F; Inter Tight + Inter
   LAYOUT: una columna; mapa de bloques → lección → mini examen → examen final → constancia */
:root{color-scheme:light dark;--bg:light-dark(#f4f2ef,#0d0d0f);--card:light-dark(#fff,#18181b);--ink:light-dark(#121115,#f2f0ea);--soft:light-dark(#5d5a60,#a9a6a0);--line:light-dark(#e2ddd8,#2a2a2f);--red:#E3242F;--ok:light-dark(#1F8A5B,#3cc486);--okbg:light-dark(#e9f5ee,#12291f);--nobg:light-dark(#fbedee,#2c1416)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif;overflow-x:clip}
.D{font-family:"Inter Tight",Inter,system-ui,sans-serif}
header{background:#121115;color:#fff;padding:18px max(5vw,16px)}
.hd{max-width:760px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font:900 28px/1 "Inter Tight",Inter,sans-serif}.logo b{color:var(--red)}
.hd button{background:none;border:1px solid #444;color:#ddd;border-radius:999px;padding:8px 14px;font:600 13px Inter;cursor:pointer;min-height:40px}
main{max-width:760px;margin:auto;padding:22px max(4vw,14px) 70px}
h1{font:800 clamp(30px,6vw,44px)/1.05 "Inter Tight",Inter,sans-serif;margin:8px 0 10px;text-wrap:balance}
h2{font:800 clamp(22px,4.6vw,28px)/1.15 "Inter Tight",Inter,sans-serif;margin:0 0 6px;text-wrap:balance}
.lead{color:var(--soft);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,28px);margin-bottom:14px}
label{display:block;font-weight:600;margin:0 0 8px}
input{width:100%;font:16px Inter;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:transparent;color:var(--ink)}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--red) 45%,transparent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 24px;border-radius:999px;border:0;background:var(--red);color:#fff;font:700 16px Inter;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:8px}
.map{display:grid;gap:12px}
.blk{display:flex;gap:16px;align-items:center;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:16px 18px;color:var(--ink);cursor:pointer;font:inherit}
.blk .n{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font:900 22px "Inter Tight",Inter,sans-serif;background:var(--bg)}
.blk b{display:block;font:800 18px/1.25 "Inter Tight",Inter,sans-serif}.blk small{color:var(--soft)}
.blk .st{margin-left:auto;flex:none;font:700 12px Inter;padding:6px 12px;border-radius:999px;background:var(--bg);white-space:nowrap}
.blk.done{border-color:color-mix(in srgb,var(--ok) 55%,transparent)}.blk.done .n{background:var(--okbg);color:var(--ok)}.blk.done .st{background:var(--okbg);color:var(--ok)}
.blk.lock{opacity:.5;cursor:not-allowed}
.blk.final .n{background:var(--red);color:#fff}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:6px 0 18px}.bar i{display:block;height:100%;background:var(--red)}
.kick{font:700 13px Inter;color:var(--red)}
ol.pp{list-style:none;counter-reset:n;padding:0;margin:12px 0 0}
ol.pp li{counter-increment:n;display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
ol.pp li::before{content:counter(n);flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--red);color:var(--red);font:800 13px Inter;display:grid;place-items:center}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.vs div{border-radius:14px;padding:12px 14px;font-size:15px}.vs .m{background:var(--nobg);border:1.5px solid color-mix(in srgb,var(--red) 40%,transparent)}.vs .y{background:var(--okbg);border:1.5px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.vs strong{display:block;font:800 12px Inter;margin-bottom:4px}.vs .m strong{color:var(--red)}.vs .y strong{color:var(--ok)}
.q{font:800 clamp(20px,4.4vw,25px)/1.25 "Inter Tight",Inter,sans-serif;margin:4px 0 16px;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{text-align:left;width:100%;min-height:54px;padding:12px 16px;border-radius:16px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:500 16px/1.4 Inter;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:700 13px Inter}
.opt.sel{border-color:var(--red)}.opt.sel .l{background:var(--red);border-color:var(--red);color:#fff}
.opt.good{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--red);background:var(--nobg)}
.fb{margin-top:12px;border-radius:14px;padding:12px 14px;font-size:15px}.fb.y{background:var(--okbg)}.fb.n{background:var(--nobg)}
.big{font:900 clamp(56px,14vw,90px)/1 "Inter Tight",Inter,sans-serif;margin:6px 0}
.pill{display:inline-block;padding:6px 14px;border-radius:999px;font:700 14px Inter}.pill.y{background:var(--okbg);color:var(--ok)}.pill.n{background:var(--nobg);color:var(--red)}
.cert{border:3px solid var(--ink);border-radius:22px;padding:28px 22px;text-align:center;background:var(--card);position:relative;overflow:hidden}
.cert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:var(--red)}
.cert .logo{color:var(--ink);font-size:40px}.cert h2{margin-top:12px}.cert .who{font:900 clamp(26px,6vw,38px)/1.1 "Inter Tight",Inter,sans-serif;margin:12px 0}
.note{font-size:13px;color:var(--soft)}

.certw{background:#fff;color:#121115;border-radius:20px;padding:10px;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.certi{position:relative;overflow:hidden;border:2px solid #121115;border-radius:14px;padding:30px 22px 26px;text-align:center;background:#fff}
.certi::after{content:"";position:absolute;inset:6px;border:1px solid #E3242F;border-radius:10px;pointer-events:none}
.certi .wm{position:absolute;left:50%;top:50%;width:78%;transform:translate(-50%,-50%);opacity:1;pointer-events:none}
.certi>*{position:relative}
.certi .lg{height:46px;margin:4px auto 0;display:block}
.certi .ttl{font:900 clamp(30px,8vw,44px)/1 "Inter Tight",Inter,sans-serif;letter-spacing:.14em;margin:18px 0 4px}
.certi .sub{font:700 12px Inter;letter-spacing:.24em;color:#E3242F}
.certi .tx{font:500 15px/1.5 Inter;color:#444;margin:16px 0 6px}
.certi .nm{font:900 clamp(26px,7vw,40px)/1.1 "Inter Tight",Inter,sans-serif;border-bottom:2px solid #121115;display:inline-block;padding:0 10px 6px;margin:4px 0 8px}
.certi .cr{font:800 18px/1.3 "Inter Tight",Inter,sans-serif;margin:6px 0}
.certi .meta{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;font:600 12px Inter;color:#555;margin:14px 0 6px}
.certi .seal{position:absolute;right:16px;top:16px;width:74px;height:74px;border-radius:50%;background:#E3242F;color:#fff;display:grid;place-items:center;font:900 10px/1.15 Inter;letter-spacing:.08em;transform:rotate(-12deg);box-shadow:0 0 0 4px #fff,0 0 0 6px #E3242F}
.certi .sig{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:30px 6px 10px}
.certi .sig div{border-top:1.5px solid #121115;padding-top:6px;font:600 11px Inter;color:#444}
.certi .club{height:54px;margin:14px auto 0;display:block}
.valid{background:var(--okbg);color:var(--ok);border-radius:14px;padding:10px 14px;font:600 14px Inter;margin-bottom:14px}
@media(max-width:420px){.certi .seal{width:60px;height:60px;font-size:8px;right:10px;top:10px}}
#splash{position:fixed;inset:0;z-index:50;background:#121115;color:#bdbab3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .4s}
#splash img{width:170px;animation:pulse 1.2s ease-in-out infinite}
#splash .ld{width:160px;height:4px;border-radius:4px;background:#2a2a2f;overflow:hidden}#splash .ld i{display:block;height:100%;width:40%;background:#E3242F;border-radius:4px;animation:ld 1s ease-in-out infinite}
#splash p{font:600 13px Inter;letter-spacing:.06em;margin:0}
#splash.out{opacity:0;pointer-events:none}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@keyframes pulse{50%{opacity:.6;transform:scale(.97)}}
@media(prefers-reduced-motion:reduce){#splash img,#splash .ld i{animation:none}}
.hide{display:none}
@media(max-width:600px){.vs{grid-template-columns:1fr}.blk .st{display:none}}
</style></head><body>

y sonríe en cuanto alguien entre.", "Saluda con energía y, si lo sabes, por su nombre.", "Resuelve sin hacerle esperar de más.", "Despide por su nombre: “¡Nos vemos mañana, Ana!”."], ["“Mmm, pásale.” (viendo el celular)", "“¡Buenos días, Ana! Qué gusto verte. ¡Que te vaya súper en la clase!”"]], ["Actitud", "El cliente siente tu energía antes de que hables.", ["Llega a tiempo y con buena cara.", "Si algo te molesta, respira; no lo descargues con el cliente.", "Si no sabes algo: “Déjame checarlo y te digo”.", "Con un cliente molesto: escucha, dale la razón en lo que sí, ofrece solución y avisa al encargado."], ["“Pues hubieras llegado antes.”", "“Tienes razón, perdón. Te aparto lugar mañana y le aviso al encargado.”"]], ["Atender a todos y ser las primeras", "Nadie se queda sin atención. Tú saludas primero.", ["Saluda a toda persona que entre, aunque estés ocupada.", "Si estás con alguien: “¡Hola! Ya voy contigo”.", "Atiende en orden de llegada.", "Ningún mensaje se queda en visto."], ["Atender a una y no voltear a ver a las otras dos.", "“¡Hola a todos, bienvenidos! Ya voy con ustedes 😊”"]], ["Nombre de los clientes", "Llamar a cada persona por su nombre crea la Familia Roxet.", ["Pregunta el nombre la primera vez y repítelo: “Mucho gusto, Ana”.", "Úsalo al saludar y al despedir.", "Si se te olvida, pregúntalo sin pena y anótalo.", "Guarda los contactos con nombre y un dato útil."], ["“Hola, joven.”", "“¡Buenos días, Luis! ¿Cómo sigue la rodilla?”"]]], "quiz": ["Calidad de servicio", "Actitud", "Atender a todos", "Nombre de clientes"]}, {"t": "Bloque 2", "n": "Dar informes en persona y por WhatsApp", "d": "Qué decir, en qué orden y cómo cerrar con una clase agendada.", "lessons": [["Cuando alguien llega a pedir informes (guion)", "Sigue estos pasos en orden, de pie y con sonrisa.", ["<b>Saluda primero:</b> “¡Hola, bienvenido a RXT! Soy Ana, ¿cómo te llamas?”.", "<b>Pregunta antes de explicar:</b> “¿Qué te gustaría lograr? ¿Tienes alguna lesión? ¿Qué horario te queda?”.", "<b>Explica según lo que te dijo:</b> cómo es la clase (1 hora con coach), horarios L–V 6–10 am y 2–9 pm, sábado 7–10 am, Energy Bar, estacionamiento y pagos (efectivo, tarjeta, transferencia).", "<b>Enséñale el lugar:</b> “Ven, te enseño dónde entrenamos”.", "<b>Recomienda una opción:</b> grupal, personalizado o rehabilitación, y di por qué le conviene.", "<b>Cierra con fecha:</b> “Tu primera clase es para conocernos. ¿Te la aparto mañana a las 7?”.", "<b>Anota</b> nombre, número, qué busca y su día en el checklist.", "<b>Despide:</b> “¡Te esperamos mañana, Mariana!”."], ["“Pues entrenas. Pregúntale al coach.”", "“Te explico: son clases con coach de 1 hora… Tu primera clase es para conocernos, ¿te la aparto mañana a las 7?”"]], ["Si dice “lo voy a pensar”", "No se presiona, pero tampoco se deja ir sin datos.", ["Responde amable: “¡Claro! Es una decisión importante”.", "Ofrece la clase sin compromiso: “¿Te aparto tu primera clase para que lo conozcas?”.", "Pide su número: “¿Me pasas tu WhatsApp para mandarte la info?”.", "Anótalo y escríbele a los 2 días."], ["“Ok, bye.”", "“¡Claro! ¿Te aparto una clase para que lo conozcas? ¿Me pasas tu número?”"]], ["Informes por WhatsApp e Instagram", "Lo mismo que en persona, pero por escrito.", ["Contesta en menos de 1 hora (ideal: 10 minutos).", "Saluda y pregunta qué busca antes de mandar precios.", "Manda la info en un solo mensaje ordenado.", "Cierra siempre con una pregunta para agendar."], ["“Precio?” → “$[precio]”", "“¡Hola! 👋 ¿Qué te gustaría lograr? Así te digo la opción que más te conviene.”"]], ["Filtrar y detectar clientes", "A cada quien lo que necesita, y a nadie se le deja ir.", ["Lesión o dolor: rehabilitación o personalizado, avisando al coach.", "Resultados rápidos o atención 1 a 1: personalizado.", "Quiere entrenar y convivir: grupal.", "Quien acompaña, comenta o pregunta: invítalo a su primera clase y pide su número."], ["Ignorar a la persona que acompaña a una clienta.", "“¿Tú también entrenas? Tu primera clase es para conocernos, ¿te la aparto?”"]]], "quiz": ["Informes en persona", "Dar información", "Entender necesidades", "Filtrar al cliente", "Clientes potenciales"]}, {"t": "Bloque 3", "n": "Operación y app RXT", "d": "Anotar todo, usar la app, resolver fallas y el sábado.", "lessons": [["Estar pendiente para apuntar", "Si no está escrito, no pasó.", ["Checklist y pluma siempre a la mano.", "Anota a cada persona nueva en el momento.", "Anota pagos, citas, quién vino y pendientes.", "Al terminar tu turno revisa que todo esté anotado."], ["“Ahorita lo anoto…” (y se olvida)", "“Déjame anotarte… listo, quedaste para mañana a las 7.”"]], ["La app de RXT: socio.roxetcenter.com", "Es nuestra propia app. Tú la dominas y se la enseñas a cada cliente.", ["<b>Agregarla en iPhone:</b> Safari → Compartir → Agregar a inicio → Agregar.", "<b>Agregarla en Android:</b> Chrome → tres puntitos → Agregar a la pantalla principal.", "<b>Si se traba:</b> revisa internet, ciérrala y ábrela otra vez.", "<b>Si sigue fallando:</b> anota a mano, toma captura del error y avisa al encargado.", "<b>Para actualizarla:</b> ciérrala por completo y ábrela, o quítala de inicio y vuelve a agregarla.", "<b>Cliente nuevo:</b> al terminar su registro se la dejas en su cel (30 segundos) y lo palomeas."], ["“La app no sirve, vuelve más tarde.”", "“Dame un segundo, te anoto a mano y luego lo paso al sistema. ¡Pásale!”"]], ["Políticas y bienvenida", "Todo cliente nuevo sale con todo completo.", ["Explícale las políticas: pagos, faltas y cancelaciones.", "Que las firme.", "Agrégalo al grupo de WhatsApp de RXT.", "Déjale la app en su celular."], ["“Listo, ya quedaste.”", "“¡Bienvenido a la Familia Roxet! Firma aquí las políticas, te agrego al grupo y te dejo la app.”"]], ["Responsabilidad del sábado", "El sábado se trabaja igual que entre semana.", ["Llega antes de las 7:00 am.", "Abre, prende luces y música; recepción lista.", "Atiende, cobra y anota igual que entre semana.", "Al cerrar deja todo orden const BC=[{"t": "Introducción", "n": "Bienvenido, coach", "d": "Qué espera RXT de su equipo de coaches y cómo usar este curso.", "quiz": [], "lessons": [["Bienvenido al equipo de coaches RXT", "El cliente paga por tener un coach con él, no solo una rutina.", ["<b>Lema:</b> “No se trata de entrenar más. Se trata de entrenar mejor.”", "<b>Qué esperamos:</b> clases con estructura, voz de mando, presencia en piso y técnica impecable.", "<b>Tu papel:</b> construir atletas, no solo cansarlos; formar personas, no solo cuerpos.", "<b>Comunidad:</b> cada clase cierra como “Familia Roxet”."], ["“Yo pongo la rutina y ya.”", "“Yo soy responsable de que cada persona entrene mejor y regrese mañana.”"]], ["Cómo funciona este curso", "Basado en el Manual del Coach RXT, dividido en bloques cortos.", ["Parte 1: el coach en piso (clase, voz, presencia, técnica y biomecánica).", "Parte 2: entrenamiento femenino. Parte 3: entrenamiento masculino, programación, recuperación, nutrición, suplementos y mentalidad.", "Cada bloque termina con un mini examen; con 80% se abre el siguiente.", "Al final: examen completo y certificado con folio y link."], ["Saltarse lecciones.", "Leer, aplicarlo en la siguiente clase y volver a repasar."]], ["Autoevaluación mensual", "Lo que no se mide no mejora.", ["Cada mes califícate del 1 al 5 en estructura, voz de mando, ejercicios, presencia y biomecánica.", "Lo que salga en 1–3 es tu prioridad del siguiente mes.", "Pide a otro coach que te observe con la misma hoja: ahí está lo más valioso."], ["“Yo ya sé todo.”", "“¿Qué puedo mejorar este mes?”"]]]}, {"t": "Bloque 1", "n": "Estructura de la clase", "d": "Las 4 partes de la clase, lo que se hace antes y cómo se cierra.", "lessons": [["Las 4 partes de la clase (60 min)", "Ninguna parte es opcional: saltarse una es entregar media clase.", ["<b>Lubricación articular (5–7 min):</b> cada articulación, 8–10 repeticiones, sin rebotes y siempre en el mismo orden.", "<b>Calentamiento específico (8–12 min):</b> subir pulsaciones, activar, movilizar las zonas del día y ensayar el ejercicio principal con poca carga.", "<b>Bloque principal (30–40 min):</b> primero fuerza o técnica, después acondicionamiento. Siempre 3 niveles: fácil, normal y avanzado.", "<b>Vuelta a la calma (5–8 min):</b> bajar pulsaciones, estiramientos de 20–30 s, respiración 4-7-8 y cierre con el grupo."], ["Arrancar directo al WOD y terminar con “ya se pueden ir”.", "Lubricación, calentamiento que ensaya lo del día, bloque principal y cierre con “Gran trabajo hoy, Familia Roxet”."]], ["Antes de la clase (10 minutos antes)", "El coach llega antes que el cliente.", ["Material listo y acomodado por estaciones, con espacio libre alrededor.", "Rutina cargada en la tele, timers probados y música lista.", "Recibir a cada cliente por su nombre.", "A los nuevos: preguntar por lesiones, dolores o embarazo antes de empezar.", "Tener claro el escalado de cada ejercicio."], ["Acomodar el material cuando ya llegó el grupo.", "Todo listo; recibe por nombre y pregunta al nuevo: “¿Alguna lesión o molestia?”."]], ["Lubricación articular y vuelta a la calma", "El inicio y el cierre también son parte de la clase.", ["Lubricación: de la cabeza a los pies (o al revés), siempre en el mismo orden para que el grupo lo aprenda.", "Cuello: sí/no e inclinaciones; nunca círculos completos rápidos.", "Cadera, rodillas y tobillos: círculos, balanceos, puntas-talones.", "Vuelta a la calma: estira lo que se trabajó, 20–30 s cada músculo, sin rebote ni dolor.", "Pierna: cuádriceps, isquios, figura 4, aductores, pantorrilla. Empuje: pectoral, hombro, tríceps. Jalón: dorsal, postura del niño, bíceps.", "Cierre: felicitar, reconocer a alguien por nombre y avisar lo próximo. Foto, choque de manos, “Familia Roxet”."], ["Círculos rápidos de cuello y “ya se pueden ir”.", "Movilidad suave en orden y cierre: “Gran trabajo, Familia Roxet. ¡Eso, Laura!”."]]], "quiz": ["Estructura de la clase"]}, {"t": "Bloque 2", "n": "Voz de mando", "d": "Instrucciones claras que todo el grupo sigue.", "lessons": [["Voz de mando: aviso + pausa + ejecución", "Instrucciones claras, cortas y con energía. No es gritar.", ["El aviso prepara en tono medio: “Sentadilla, en posición…”.", "La ejecución dispara fuerte y seco: “¡YA!”.", "Habla desde el abdomen, no desde la garganta.", "Baja la música para explicar y súbela para trabajar.", "Máximo 3 indicaciones a la vez: verbo + parte del cuerpo (“pecho arriba”, “rodillas afuera”).", "Lenguaje seguro: “Vamos a…”, nunca “si quieren” o “más o menos”."], ["Gritar con la garganta sobre la música: “Si quieren, hagan sentadilla más o menos así…”.", "Bajar la música: “Miren aquí. Tres cosas: pies al ancho, pecho arriba, rodillas afuera. En posición… ¡YA!”."]], ["Corregir y motivar con la voz", "Felicita en público, corrige cerca y en voz normal.", ["Usa nombres: “¡Eso, Laura!” pega más que “¡Bien, todos!”.", "Cuenta en voz alta los últimos 3–5 segundos.", "Si alguien lo hace mal, acércate y corrígelo a su lado, sin exhibirlo.", "En la vuelta a la calma, tono tranquilo y bajo."], ["“¡Laura, lo estás haciendo mal!” frente a todos.", "Te acercas: “Laura, baja el pecho un poco más… ¡eso es!”."]], ["Frases por momento y cómo entrenar tu voz", "Ten listas las frases de cada parte de la clase.", ["<b>Inicio:</b> “¡Buenos días, Familia Roxet! Hoy toca pierna y acondicionamiento. Todos frente a mí.”", "<b>Durante:</b> “¡Respira!”, “¡Controla la bajada!”, “¡Uno más!”", "<b>Últimos segundos:</b> “¡Diez segundos, todo lo que queda!”", "<b>Cambio:</b> “¡Tiempo! Dejen el material en su lugar, giren a la derecha.”", "<b>Entrena tu voz:</b> grábate una clase, practica las órdenes antes y toma agua; cuida la voz a las 6 am."], ["Hablar sin parar todo el bloque.", "Frases cortas en el momento justo y silencio para que trabajen."]]], "quiz": ["Voz de mando"]}, {"t": "Bloque 3", "n": "Presencia en piso", "d": "Ver a todos, todo el tiempo, adentro y afuera.", "lessons": [["Reglas de oro en piso", "El cliente paga por tener un coach con él.", ["Nunca sentado y nunca en el celular (solo para la tele o la música).", "Muévete cada 30–60 segundos, en forma de “8” por todas las estaciones.", "Toca base con cada cliente al menos una vez: corrección, felicitación o su nombre.", "Cuando no corrijas, ponte de espaldas a la pared para ver a todos.", "No entrenes con el grupo: demuestras y vuelves a observar."], ["Coach en una esquina viendo el celular.", "Coach caminando en “8”, corrigiendo y llamando a cada quien por su nombre."]], ["Desde dónde mirar y entrenar afuera", "Cada ángulo muestra un error distinto.", ["<b>De perfil:</b> espalda redondeada, profundidad, barra que se aleja.", "<b>De frente:</b> rodillas hacia adentro, desequilibrios, pies.", "<b>Por detrás:</b> escápulas, hombros encogidos, simetría.", "<b>Afuera:</b> revisa la ruta antes, cuenta cabezas al salir y al regresar, ve al final del grupo y lleva celular, agua y botiquín."], ["Ir adelante en la carrera y perder de vista al grupo.", "Ir al final o en el punto de giro, contando cabezas."]], ["Seguridad del espacio", "Un gym ordenado evita lesiones.", ["Espacio libre alrededor de la llanta, las cuerdas y los cajones.", "Material regresado a su lugar al cambiar de estación.", "Discos y mancuernas en el piso son tropiezos.", "Cajones estables y sobre superficie antideslizante.", "Máquinas con la correa de pies ajustada."], ["Dejar discos tirados entre estaciones.", "“¡Tiempo! Material a su lugar y giren a la derecha.”"]]], "quiz": ["Presencia en piso"]}, {"t": "Bloque 4", "n": "Enseñar y corregir", "d": "Dominar cada ejercicio y corregirlo en segundos.", "lessons": [["Las 5 preguntas de cada ejercicio", "Para cada ejercicio de la clase debes poder responder:", ["¿Qué trabaja? (sentadilla: cuádriceps, glúteo, aductores y core)", "¿Cuáles son sus 3 puntos clave? (pies firmes, pecho arriba, rodillas en línea con los pies)", "¿Cuál es el error más común? (rodillas hacia adentro)", "¿Cómo lo corrijo? (“rodillas afuera, abre el piso”, mini banda)", "¿Cuál es la versión fácil y la difícil? (a cajón / frontal o con salto)"], ["Poner un ejercicio sin saber escalarlo.", "Llevar siempre versión fácil, normal y avanzada."]], ["Enseñar un ejercicio en 6 pasos", "Dominarlo es poder explicarlo, verlo mal y arreglarlo en segundos.", ["Nombra el ejercicio.", "Demuestra 2 repeticiones perfectas, de perfil al grupo.", "Explica solo 2 o 3 puntos clave.", "Que practiquen sin carga o con carga ligera.", "Corrige una cosa a la vez (primero seguridad: espalda y rodillas).", "Refuerza lo que salió bien."], ["Explicar 8 puntos a la vez y corregir todo junto.", "“Sentadilla. Miren de perfil… Tres cosas. ¡Practiquen!” y una corrección a la vez."]], ["Corregir bien: cues y la regla del dolor", "Frases que apuntan a un resultado, no a un músculo.", ["<b>Cue externo:</b> “Empuja el piso” funciona mejor que “activa el cuádriceps”.", "<b>Visual:</b> demuéstralo a su lado, incorrecto y correcto.", "<b>Táctil:</b> solo avisando antes (“te voy a tocar el hombro”) y con respeto.", "Si no sale en 2 intentos: baja la carga, reduce el rango o cambia a una variante más fácil.", "<b>Sándwich:</b> positivo, corrección, positivo.", "<b>Si hay dolor</b> (no cansancio): se detiene, preguntas dónde y cómo, cambias a variante sin dolor y lo anotas."], ["“Aguántate, así es al principio.”", "“Para. ¿Dónde te duele? Vamos con esta variante y lo anoto para seguimiento.”"]]], "quiz": ["Técnica y corrección"]}, {"t": "Bloque 5", "n": "Biomecánica básica", "d": "Columna neutra, brace, patrones y la sentadilla.", "lessons": [["Biomecánica básica: la sentadilla como ejemplo", "Columna neutra, brace y patrones de movimiento.", ["<b>Columna neutra:</b> la espalda mantiene sus curvas, ni redonda ni arqueada.", "<b>Brace:</b> inhalar y apretar el abdomen como si te fueran a dar un golpe.", "<b>Sentadilla:</b> pies al ancho de hombros, puntas un poco afuera; cadera atrás y abajo; rodillas siguen las puntas; pecho arriba; sube empujando el piso.", "<b>Rodillas hacia adentro:</b> “rodillas afuera, abre el piso”, mini banda.", "<b>Talones se levantan:</b> “peso en medio pie y talón”, disco bajo los talones.", "<b>Torso al frente:</b> “pecho orgulloso”, cambiar a goblet."], ["Dejar que baje con la espalda redondeada para llegar más profundo.", "Limitar la profundidad hasta donde la espalda se mantiene neutra."]], ["Patrones de movimiento", "Si conoces el patrón, conoces la técnica de sus variantes.", ["<b>Dominante de rodilla:</b> sentadilla, steps, saltos a caja.", "<b>Bisagra de cadera:</b> peso muerto, voltear llanta.", "<b>Empuje horizontal:</b> lagartijas, press de pecho. <b>Vertical:</b> press militar.", "<b>Tracción horizontal:</b> remos y remadora. <b>Vertical:</b> jalón al pecho.", "<b>Aislamiento / acondicionamiento:</b> curl de bíceps, olas con cuerda.", "Debes poder explicar los 14 ejercicios del manual y dominar remadora y SkiErg."], ["Enseñar cada ejercicio como si fuera algo nuevo.", "“Esto es una bisagra, igual que el peso muerto: cadera atrás, espalda neutra.”"]]], "quiz": ["Biomecánica"]}, {"t": "Bloque 6", "n": "Entrenamiento femenino", "d": "Hormonas, fases del ciclo y etapas hacia la menopausia.", "lessons": [["Estrógeno y progesterona", "Las dos hormonas que cambian la energía de tus clientas.", ["<b>Estrógeno:</b> mejora el uso de carbohidratos, la fuerza, la coordinación y el ánimo. En su pico se logran las mejores marcas.", "<b>Progesterona:</b> calmante; aumenta la temperatura y reduce la coordinación fina. Ideal para trabajo moderado y técnica.", "<b>Cómo acompañar:</b> menstrual = escuchar y bajar carga; folicular = retos; ovulatoria = trabajo en grupo; lútea = control, respiración y empatía."], ["Exigir lo mismo todos los días a todas.", "Leer la energía de la clienta y ofrecer la versión que le funcione."]], ["Las 4 fases del ciclo", "El cuerpo femenino no es irregular, es cíclico.", ["<b>Menstrual (días 1–5):</b> movilidad, core, respiración y fuerza ligera. Evitar récords.", "<b>Folicular (días 6–13):</b> la fase ideal para fuerza, potencia, PRs y WODs intensos.", "<b>Ovulatoria (14–17):</b> máximo rendimiento, pero ligamentos más elásticos: cuidar técnica y estabilidad.", "<b>Lútea (18–28):</b> cardio moderado, circuitos aeróbicos, fuerza técnica o movilidad.", "En grupo no preguntes la fase frente a todos: ofrece siempre versión ligera e intensa y respeta si baja la carga."], ["“¿En qué día de tu ciclo estás?” frente al grupo.", "“Hoy hay versión ligera y versión intensa; elige la que te funcione.”"]], ["Etapas hacia la menopausia y el cortisol", "Preservar músculo, hueso y energía.", ["<b>Premenopausia (35–45):</b> fuerza progresiva, control del estrés, movilidad.", "<b>Perimenopausia (40–50):</b> fuerza + cardio suave; evitar HIIT diario y ayunos largos.", "<b>Menopausia (50+):</b> fuerza con carga, equilibrio, caminatas y proteína alta.", "Cortisol alto por falta de descanso: dormir 7–8 h, 3–4 días de fuerza y 1–2 de cardio moderado, no entrenar en ayunas siempre."], ["HIIT diario a una clienta de 48 años con insomnio.", "Fuerza 3 días + cardio suave y recuperación activa."]]], "quiz": ["Entrenamiento femenino"]}, {"t": "Bloque 7", "n": "Fisiología masculina", "d": "Testosterona, cortisol, GH y suprarrenales.", "lessons": [["Hormonas masculinas", "Testosterona, cortisol y suprarrenales en equilibrio.", ["<b>Testosterona sube con:</b> cargas altas (70–90%), dormir 7–9 h, grasas buenas, sol y vitamina D3, menos estrés.", "<b>Cortisol:</b> no es malo; lo malo es no dejarlo bajar. No entrenar pesado más de 4 días seguidos y descarga cada 3–5 semanas.", "<b>Sobrecarga:</b> cansancio constante, dolor lumbar difuso, mal sueño, irritabilidad, estancamiento.", "Si los síntomas duran semanas aunque bajes la carga: sugiere revisión médica. El coach ajusta, no diagnostica."], ["“Tienes fatiga suprarrenal, toma esto.”", "“Bajemos la carga esta semana; si sigues igual, conviene que te revise un médico.”"]], ["Hormona del crecimiento y suprarrenales", "Reparar y apagar el estrés.", ["La GH se libera en el sueño profundo y tras entrenos intensos: regenera fibras y quema grasa.", "Para apoyarla: dormir profundo sin pantallas, ejercicios multiarticulares intensos y evitar azúcar antes de dormir.", "Las suprarrenales dan energía en el esfuerzo (adrenalina, cortisol) y deben “apagarse” después.", "No entrenar al fallo más de 3 veces por semana; hidratación, electrolitos y menos exceso de cafeína."], ["Entrenar al fallo todos los días.", "Alternar días intensos con días de movilidad o recuperación."]]], "quiz": ["Hormonas masculinas"]}, {"t": "Bloque 8", "n": "Fundamentos y sistemas energéticos", "d": "Fuerza, hipertrofia, fibras y de dónde sale la energía.", "lessons": [["La fuerza como cimiento", "Sin fuerza no hay hipertrofia; sin control no hay fuerza.", ["<b>Fuerza pura:</b> 4–6 series de 3–6 reps al 80–90%, descanso 2–3 min.", "<b>Hipertrofia mixta:</b> 3–5 series de 8–12 al 65–80%, 60–90 s.", "<b>Hipertrofia metabólica:</b> 3–4 series de 12–20 al 55–70%, 30–60 s.", "<b>Sobrecarga progresiva:</b> cada semana un poco más (peso, reps, control o menos descanso).", "<b>Errores en hombres:</b> entrenar sin propósito, pesado todos los días y mucho ego con poca técnica."], ["“Hoy nos matamos” todos los días.", "Cada sesión tiene un objetivo y produce una adaptación, no solo sudor."]], ["Hipertrofia, fibras y métodos", "Cada estímulo construye algo distinto.", ["<b>Tensión mecánica:</b> cargas altas y control. <b>Estrés metabólico:</b> 12–20 reps, descanso corto. <b>Daño muscular:</b> unilaterales, tempo lento, excéntricas.", "<b>Fibras tipo I:</b> resistencia. <b>IIa:</b> mixtas (8–12 reps). <b>IIb:</b> fuerza máxima (3–6 reps).", "<b>Métodos:</b> bi-series, pirámides, cluster sets, tempo, EMOM/AMRAP.", "Fallo controlado (RIR 0–1) sí, pero no en cada serie."], ["Siempre el mismo rango y la misma carga.", "Variar estímulos con un propósito por fase."]], ["Los 3 sistemas energéticos", "El cuerpo cambia de combustible según intensidad y duración.", ["<b>ATP–PC (0–10 s):</b> fuerza máxima y sprints; necesita 2–3 min de descanso.", "<b>Glucolítico (10 s – 2 min):</b> MetCon y circuitos; la “quemazón”.", "<b>Oxidativo (más de 2 min):</b> cardio suave; base de la recuperación. 2 sesiones de 20–40 min por semana.", "No repitas el mismo estímulo dos días seguidos."], ["Fuerza máxima y cardio largo en la misma sesión.", "Lunes fuerza, martes MetCon, miércoles movilidad + cardio suave."]]], "quiz": ["Fundamentos", "Sistemas energéticos"]}, {"t": "Bloque 9", "n": "Programación y recuperación", "d": "Fases, semana híbrida, descanso y sueño.", "lessons": [["Programación híbrida", "Levantar, moverse, resistir y recuperarse.", ["Fases: adaptación (2–3 sem), fuerza (4–6), hipertrofia funcional (4–6), MetCon técnico (3–4) y descarga (1 semana).", "Fuerza y potencia al inicio de la semana; MetCon en días intermedios o finales.", "Si se hacen ambos el mismo día: primero fuerza.", "Mide el progreso más allá del espejo: cargas, recuperación entre rondas y energía al día siguiente."], ["Meter volumen de más “para que sude”.", "Priorizar técnica e intensidad y combinar días de fuerza con días de condición."]], ["Recuperación y sueño", "La adaptación ocurre en el descanso.", ["La recuperación tarda 24 a 72 horas: alterna días duros con días controlados.", "Dormir 7–9 h y evitar pantallas 45 min antes.", "Comida post-entreno (30–60 min): proteína + carbohidrato.", "Semana de descarga cada 4–6 semanas: bajar volumen o intensidad 40–50%.", "Señales de sobreentrenamiento: fatiga constante, dolor continuo, cambios de humor, estancamiento."], ["“Si estás cansado, entrena más fuerte.”", "“Esta semana es de descarga: bajamos 40% y regresas más fuerte.”"]], ["Simpático, parasimpático y buena recuperación", "Acelerador y freno.", ["<b>Simpático:</b> acelerador (entrenar, alerta). <b>Parasimpático:</b> freno (descanso, digestión, reparación).", "Para activar el freno: respiración 4-7-8, meditación breve, música relajante o caminata lenta.", "Recuperación activa: foam roller, caminata o bici suave, movilidad.", "Señales de buena recuperación: despierta con energía, duerme profundo, sube cargas sin perder técnica, menos irritabilidad."], ["Terminar la clase y mandarlos directo a la calle acelerados.", "Cerrar con respiración y bajar pulsaciones."]]], "quiz": ["Programación", "Recuperación"]}, {"t": "Bloque 10", "n": "Nutrición y suplementos", "d": "Comer para rendir y orientar sin recetar.", "lessons": [["Nutrición para rendir", "El músculo se construye en el gym y se consolida en la cocina.", ["<b>Proteína:</b> 1.8–2.5 g por kg al día.", "<b>Carbohidratos:</b> 3–6 g por kg según actividad; muy útiles post-entreno.", "<b>Grasas:</b> 0.8–1.2 g por kg; no eliminarlas.", "No todos necesitan déficit; algunos necesitan energía.", "Para planes detallados, apóyate en un nutriólogo."], ["Poner a todos a dieta estricta.", "Enseñar a comer para rendir y mandar al nutriólogo si necesita un plan."]], ["Cuándo comer e hidratación", "El momento importa.", ["<b>1–2 h antes:</b> carbohidrato complejo + proteína (avena + proteína).", "<b>Durante (más de 60–70 min):</b> hidratos simples + electrolitos.", "<b>Después:</b> proteína rápida + carbohidrato (batido + plátano).", "<b>Agua:</b> 30–40 ml por kg de peso; sales en días de mucho sudor; beber antes de tener sed.", "Definición: déficit máximo 15–20% y no más de 10–12 semanas."], ["“No comas nada antes de entrenar para quemar más.”", "“Come algo 1–2 horas antes y trae agua.”"]], ["Suplementos: herramientas, no milagros", "El coach orienta, no receta.", ["Antes de sugerir algo pregunta por medicamentos, condiciones médicas o embarazo; en esos casos, médico o nutriólogo.", "<b>Creatina:</b> 5 g diarios, sin ciclos; el de mayor respaldo.", "<b>Whey:</b> 20–30 g post-entreno; no sustituye la comida.", "<b>Cafeína:</b> no pasar de 400 mg al día.", "Poca evidencia: BCAA (si ya come suficiente proteína), tribulus, CLA y quemadores."], ["Recomendar un quemador a quien toma medicamento para la presión.", "Preguntar primero y mandarlo con su médico."]], ["Qué no recomendar", "No todo lo que se vende sirve.", ["BCAA: poca utilidad si ya come suficiente proteína.", "Tribulus: no aumenta la testosterona.", "CLA: efectos mínimos.", "Quemadores: placebo o solo por la cafeína.", "“Un atleta inteligente no colecciona botes, colecciona resultados.”"], ["“Tómate este quemador y bajas rápido.”", "“Primero sueño, comida y entrenamiento; luego vemos si hace falta algo.”"]]], "quiz": ["Nutrición", "Suplementos"]}, {"t": "Bloque 11", "n": "Mentalidad", "d": "Disciplina, constancia y formar personas.", "lessons": [["Mentalidad", "El cuerpo se fortalece con hierro; la mente, con disciplina.", ["El entrenamiento empieza cuando decides entrenar.", "Forma atletas, pero también personas.", "Enseña autocontrol, respeto y constancia.", "Usa la autoevaluación del coach cada mes (1 a 5): lo que salga en 1–3 es tu prioridad."], ["Solo exigir resultados.", "Reconocer el esfuerzo y la constancia de cada quien."]], ["Disciplina y mentalidad antifrágil", "La constancia bajo incomodidad hace la diferencia.", ["El progreso no es lineal: habrá días buenos y días difíciles.", "3 pilares: resiliencia física, estabilidad emocional y propósito claro.", "Disciplina: hazlo aunque no tengas ganas, planifica, registra avances y rodéate de una comunidad que exija.", "Conexión mente-músculo: visualiza, evita distracciones, respira con intención y usa tempo controlado."], ["“Hoy no tengo ganas, mejor me salto.”", "“Hoy sale lo que salga, pero se hace.”"]]], "quiz": ["Mentalidad"]}];

function cert(){
  const f=S.final;if(!f.folio){f.folio='RXT-'+(ROLE==='coach'?'C':'R')+'-'+Date.now().toString(36).toUpperCase().slice(-6);save()}
  const c={n:S.name,r:ROLE,p:f.pct,d:new Date().toLocaleDateString('es-MX',{dateStyle:'long'}),f:f.folio,b:B.length-1};
  if(!f.cd){f.cd=c.d;save()}c.d=f.cd;
  const link=URL0+'#c-'+enc(c);
  const txt=`🏅 ${RN[ROLE]} — APROBADO\nNombre: ${S.name}\nCalificación: ${f.pct}%\nFolio: ${f.folio}\nCertificado: ${link}`;
  $('vCert').innerHTML=certHTML(c)+`<div class="row"><a class="btn" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">Mandar certificado por WhatsApp</a><button class="btn ghost" id="cpl">Copiar link del certificado</button><button class="btn ghost" id="cb">Ver bloques</button></div>
  <p class="note" id="cpn">El link abre este certificado. También puedes tomar captura de pantalla.</p>`;
  $('cb').onclick=map;$('cpl').onclick=async()=>{try{await navigator.clipboard.writeText(link);$('cpn').textContent='Link copiado.'}catch(e){$('cpn').textContent=link}};
  show('vCert');
}
function fromHash(){
  const h=location.hash;if(!h.startsWith('#c-'))return false;
  try{const c=dec(h.slice(3));HASHVIEW=true;$('vCert').innerHTML=`<div class="valid">✓ Certificado de capacitación emitido por Roxet Training Club</div>`+certHTML(c)+`<div class="row"><button class="btn ghost" id="cb2">Ir a los cursos</button></div>`;
    $('cb2').onclick=()=>{HASHVIEW=false;try{history.replaceState(null,'',' ')}catch(e){}show('vStart')};show('vCert');return true}catch(e){return false}
}
$('nm').oninput=()=>$('nmErr').textContent='';
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{const n=$('nm').value.trim();if(n.length<3){$('nmErr').textContent='Escribe tu nombre completo y luego elige tu curso.';return}
  load(b.dataset.role);if(S.name!==n){S={name:n,done:[],final:null}}save();map()});
$('home').onclick=map;
$('chg').onclick=()=>{show('vStart')};
function boot(){if(fromHash())return;try{const r=localStorage.getItem('rxtRole');if(r){load(r);if(S.name){$('nm').value=S.name;const ps=S.pos;
  if(ps&&ps.v==='l'&&B[ps.k]&&B[ps.k].lessons[ps.j])return lesson(ps.k,ps.j);
  if(ps&&ps.v==='q'&&(ps.k==='F'||B[ps.k]))return quiz(ps.k);
  map()}}}catch(e){}}
const sp=$('splash');setTimeout(()=>{boot();sp.classList.add('out');setTimeout(()=>sp.remove(),450)},1100);
window.addEventListener('hashchange',fromHash);
}
</script></body></html>
